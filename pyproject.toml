[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-security-audit"
version = "0.1.0"
description = "Read-only checks for common security mistakes in your own AWS account"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "moto[cloudtrail,config,ec2,guardduty,iam,kms,rds,s3,s3control,sts]>=5.0",
    "pytest>=8",
]

[project.scripts]
aws-security-audit = "aws_security_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aws_security_audit = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
